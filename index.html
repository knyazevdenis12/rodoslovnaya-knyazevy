<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Родословная Князевых</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0b1220;color:#e5e7eb}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{flex:0 0 auto;position:relative;z-index:400;background:linear-gradient(135deg,#1e3a5f 0%,#1e293b 55%,#2d2b57 100%);border-bottom:1px solid #4b6a94;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.topbar-main{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:54px}
.topbar-main .logo{min-width:0;overflow:hidden;text-overflow:ellipsis;margin-right:0}
.topbar .menu-toggle{flex:0 0 auto;font-weight:700;min-width:118px;background:#2563eb;border-color:#60a5fa}
.topbar .menu-toggle:hover{background:#3b7bff}
.topbar-body{display:none;position:absolute;top:100%;left:0;right:0;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;background:linear-gradient(135deg,#1e3a5f 0%,#1e293b 60%,#2d2b57 100%);border-bottom:1px solid #4b6a94;box-shadow:0 18px 36px rgba(0,0,0,.5)}
.topbar.open .topbar-body{display:flex}
.search::placeholder{color:#94a3b8}
.bday{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;border-radius:12px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.45);color:#fef3c7;font-size:14px;line-height:1.4}
.bday .bday-name{border:0;background:transparent;color:#fde68a;font-weight:800;text-decoration:underline;padding:2px 4px;font-size:14px;border-radius:6px}
.bday .bday-name:hover{background:rgba(255,255,255,.14)}
.bday .bday-when{color:#fef3c7;font-weight:600}
.bday.memory{background:rgba(148,163,184,.14);border-color:rgba(148,163,184,.45);color:#e2e8f0}
.bday.memory .bday-name{color:#e2e8f0}
.bday.memory .bday-when{color:#cbd5e1}
.topbar button.active{background:#2563eb;border-color:#60a5fa}
#treeArea.drawing-group .person{cursor:pointer}
.group-oval{fill-opacity:.4;pointer-events:none}
.group-editor{position:fixed;z-index:500;background:#172033;border:1px solid #475569;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:12px;width:238px;display:none}
.group-editor.open{display:block}
.group-editor-hint{font-size:12px;color:#94a3b8;margin-bottom:10px;line-height:1.4}
.group-editor-swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:10px}
.group-editor-swatches button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0;cursor:pointer}
.group-editor-swatches button.active{border-color:#fff;box-shadow:0 0 0 2px #172033,0 0 0 4px #fff}
.group-editor-actions{display:flex;justify-content:space-between;gap:8px}
.group-editor-actions button{flex:1;padding:8px;border-radius:9px;border:1px solid #475569;background:#243044;color:#fff;font-size:13px}
.group-editor-actions .danger{background:#3f1d2b;border-color:#7f1d3a;color:#fecdd3}
.logo{font-weight:800;font-size:18px;white-space:nowrap;margin-right:6px}
.topbar button{border:1px solid #5b7ba6;background:#2b3f5e;color:#fff;padding:8px 11px;border-radius:9px}
.topbar button:hover{background:#3b5580}
.topbar .primary{background:#2563eb;border-color:#3b82f6}
.topbar .save{background:#15803d;border-color:#22c55e}
.search{width:210px;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:9px;padding:8px 10px;outline:0}
.stats{margin-left:auto;color:#cbd5e1;font-size:12px;white-space:nowrap}
.workspace{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#treeArea{position:absolute;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:radial-gradient(circle at center,rgba(59,130,246,.08),transparent 42%),#0b1220}
#treeArea:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.08) 1px,transparent 1px);background-size:40px 40px}
#world{position:absolute;left:0;top:0;width:9000px;height:6000px;transform-origin:0 0}
#connections{position:absolute;left:0;top:0;width:9000px;height:6000px;overflow:visible;pointer-events:none}
.connection{fill:none;stroke:#94a3b8;stroke-width:3.5;stroke-linecap:round;pointer-events:none}
.connection.spouse{stroke:#f59e0b}
.connection.selected{stroke:#60a5fa;stroke-width:5}
.connection-hit{fill:none;stroke:transparent;stroke-width:32;pointer-events:stroke;cursor:pointer}
.line-handle{fill:#60a5fa;stroke:#fff;stroke-width:3;cursor:grab;pointer-events:auto}
#peopleLayer{position:absolute;left:0;top:0;width:9000px;height:6000px;pointer-events:none}#world{pointer-events:none}
.person{pointer-events:auto;position:absolute;width:210px;min-height:126px;background:#1e293b;border:2px solid #475569;border-radius:15px;box-shadow:0 12px 28px rgba(0,0,0,.32);overflow:hidden;cursor:grab;user-select:none;-webkit-touch-callout:none;touch-action:none;transition:box-shadow .1s,border-color .1s}
.person:hover{border-color:#64748b}
.person.dragging{cursor:grabbing;border-color:#60a5fa;box-shadow:0 18px 40px rgba(0,0,0,.5);transition:none;z-index:1000}
.person.highlight{border-color:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.18),0 18px 40px rgba(0,0,0,.45)}
.person.search-match{border-color:#00ff88!important;box-shadow:0 0 0 5px rgba(0,255,136,.32),0 0 28px rgba(0,255,136,.42),0 18px 40px rgba(0,0,0,.5)!important;z-index:1200}
.person.search-match .name{color:#ffffff;text-shadow:0 0 10px rgba(0,255,136,.55)}
.person.search-dim{opacity:.28;filter:saturate(.45)}
.search:focus{border-color:#00ff88;box-shadow:0 0 0 3px rgba(0,255,136,.18)}
.search-count{color:#00ff88;font-weight:800;font-size:12px;white-space:nowrap}
.export-wrap{position:relative;display:inline-flex}.export-menu{position:absolute;top:calc(100% + 7px);left:0;min-width:210px;background:#1e2f4a;border:1px solid #5b7ba6;border-radius:10px;box-shadow:0 18px 45px rgba(0,0,0,.5);padding:6px;display:none;z-index:300}.export-menu.open{display:block}.export-menu button{display:block;width:100%;text-align:left;border:0!important;background:transparent!important;padding:9px 10px;border-radius:7px}.export-menu button:hover{background:#3b5580!important}.export-status{font-size:12px;color:#94a3b8}.lock-badge{font-size:12px;color:#fbbf24;font-weight:700}.save-time{font-size:11px;color:#cbd5e1;white-space:nowrap}.history-list{max-height:420px;overflow:auto}.history-item{padding:10px;border-bottom:1px solid #334155}.history-item strong{display:block;color:#e2e8f0}.history-item span{display:block;color:#94a3b8;font-size:11px;margin-top:3px}.person.locked{cursor:pointer}
.person.male{border-color:#3b82f6}.person.female{border-color:#ec4899}
.card-top{display:flex;gap:10px;padding:10px}
.avatar{width:58px;height:58px;flex:0 0 58px;border-radius:12px;overflow:hidden;background:#334155;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:23px;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{min-width:0}.name{font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere;color:#f8fafc}
.date{font-size:11px;color:#94a3b8;margin-top:5px}.maiden{font-size:11px;color:#cbd5e1;margin-top:3px;font-style:italic}.place{font-size:11px;color:#94a3b8;margin-top:3px}
.card-bottom{border-top:1px solid rgba(148,163,184,.2);padding:7px 10px;color:#e2e8f0;font-size:12px;font-weight:600}
.panel{position:absolute;right:12px;top:12px;width:330px;max-height:calc(100% - 24px);overflow:auto;background:rgba(15,23,42,.97);border:1px solid #334155;border-radius:15px;box-shadow:0 20px 50px rgba(0,0,0,.45);z-index:200;display:none}
.panel.open{display:block}.panel-head{position:sticky;top:0;background:#172033;border-bottom:1px solid #334155;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.close{width:30px;height:30px;border-radius:8px;border:1px solid #475569;background:#243044;color:#fff}.panel-body{padding:15px}
.field{margin-bottom:11px}.field label{display:block;color:#94a3b8;font-size:12px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:8px;padding:9px;outline:0}
.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#60a5fa}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:1px solid #475569;background:#243044;color:#fff;padding:8px 10px;border-radius:8px}.actions .primary{background:#2563eb;border-color:#3b82f6}.actions .danger{background:#7f1d1d;border-color:#991b1b}
.detail-name{font-size:21px;font-weight:800;margin-bottom:8px}.detail-row{padding:8px 0;border-bottom:1px solid rgba(148,163,184,.12)}.label{color:#64748b;font-size:11px;margin-bottom:3px}.value{color:#e2e8f0;font-size:13px;line-height:1.4}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:none;align-items:center;justify-content:center}.modal-bg.open{display:flex}
.modal{width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#172033;border:1px solid #475569;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.modal-head,.modal-foot{padding:14px 17px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}.modal-foot{border-top:1px solid #334155;border-bottom:0;justify-content:flex-end;gap:8px}.modal-body{padding:17px}
.help{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 96px);z-index:150;background:rgba(15,23,42,.9);border:1px solid #334155;border-radius:9px;padding:8px 11px;color:#94a3b8;font-size:11px;pointer-events:none}
.zoom-btns{position:absolute;right:12px;bottom:12px;z-index:150;display:flex;flex-direction:column;gap:8px}
.zoom-btns button{width:44px;height:44px;border-radius:12px;border:1px solid #475569;background:rgba(23,32,51,.95);color:#fff;font-size:22px;line-height:1;padding:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#15803d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:900}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.logo{font-size:16px}.topbar button{padding:8px 9px;font-size:13px}.stats{margin-left:0}.search{flex:1 1 140px;width:auto;min-width:120px}.panel{width:calc(100% - 24px)}}
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-main">
    <button type="button" class="menu-toggle" id="menuToggle" onclick="toggleTopbar()" aria-expanded="false" aria-controls="topbarBody">☰ Меню</button>
    <div class="logo">🌳 Родословная Князевых</div>
  </div>
  <div class="topbar-body" id="topbarBody">
    <div id="birthdayBanner" class="bday"></div>
    <div id="memoryBanner" class="bday memory"></div>
    <button class="primary" onclick="openPersonEditor()">＋ Человек</button>
    <button onclick="startConnectMode()">🔗 Связь</button>
    <button type="button" id="groupDrawBtn" onclick="toggleGroupDrawMode()">🎨 Выделение</button>
    <button class="save" onclick="saveAll()">💾 Сохранить на сервер</button>
    <button onclick="toggleLockAll()" id="lockAllBtn">🔒 Зафиксировать все</button>
    <button onclick="loadFromServerUI()">☁️ Загрузить с сервера</button>
    <button onclick="openHistory()">🕘 История изменений</button>
    <span id="lockBadge" class="lock-badge"></span>
    <span id="saveTime" class="save-time"></span>
    <div class="export-wrap" id="exportWrap">
      <button type="button" onclick="toggleExportMenu(event)">📤 Экспорт ▾</button>
      <div id="exportMenu" class="export-menu">
        <button type="button" onclick="exportTree('pdf')">📄 PDF</button>
        <button type="button" onclick="exportTree('png')">🖼 PNG</button>
        <button type="button" onclick="exportTree('jpeg')">🖼 JPEG</button>
        <button type="button" onclick="exportTree('tiff')">🖼 TIFF</button>
        <button type="button" onclick="exportTable('xlsx')">📊 Таблица Excel (.xlsx)</button>
        <button type="button" onclick="exportTable('csv')">📋 Таблица CSV (.csv)</button>
      </div>
    </div>
    <input id="search" class="search" placeholder="Поиск человека…">
    <span id="searchCount" class="search-count"></span>
    <div id="stats" class="stats"></div>
  </div>
</header>

<main class="workspace">
  <div id="treeArea">
    <div id="world">
      <svg id="connections" viewBox="0 0 9000 6000"></svg>
      <div id="peopleLayer"></div>
    </div>
  </div>

  <aside id="panel" class="panel">
    <div class="panel-head"><strong id="panelTitle"></strong><button class="close" onclick="closePanel()">×</button></div>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div class="help">Тяните карточку или пустое место пальцем · щипок двумя пальцами — масштаб · стрелка: родитель → ребёнок · оранжевая ⇄ — супруги</div>
  <div class="zoom-btns"><button type="button" onclick="zoomBy(1.25)" aria-label="Приблизить">＋</button><button type="button" onclick="zoomBy(0.8)" aria-label="Отдалить">－</button></div>
</main>

<div id="toast" class="toast"></div>
<div id="groupEditor" class="group-editor">
  <div class="group-editor-hint">Коснитесь карточки — отметит её текущим цветом. Коснитесь ещё раз — снимет отметку.</div>
  <div class="group-editor-swatches" id="groupSwatches"></div>
  <div class="group-editor-actions">
    <button type="button" class="danger" onclick="clearActiveGroup()">🗑 Убрать этим цветом</button>
    <button type="button" onclick="toggleGroupDrawMode()">Готово</button>
  </div>
</div>
<div id="modalBg" class="modal-bg">
  <div class="modal">
    <div class="modal-head"><strong id="modalTitle">Человек</strong><button class="close" onclick="closeModal()">×</button></div>
    <form id="personForm">
      <div class="modal-body">
        <input id="editId" type="hidden">
        <div class="row">
          <div class="field"><label>Имя</label><input id="firstName" required></div>
          <div class="field"><label>Фамилия</label><input id="lastName"></div>
        </div>
        <div class="row">
          <div class="field"><label>Отчество</label><input id="patronymic"></div>
          <div class="field"><label>Девичья фамилия</label><input id="maidenName"></div>
        </div>
        <div class="row">
          <div class="field"><label>Дата рождения</label><input id="birthDate"></div>
          <div class="field"><label>Дата смерти (если умер)</label><input id="deathDate"></div>
        </div>
        <div class="row">
          <div class="field"><label>Место рождения</label><input id="birthPlace"></div>
          <div class="field"><label>Пол</label><select id="gender"><option value="male">Мужчина</option><option value="female">Женщина</option><option value="unknown">Не указан</option></select></div>
        </div>
        <div class="field"><label>Фотография</label><input id="photo" type="file" accept="image/*"></div>
        <div class="field"><label>Родители</label><select id="parents" multiple size="6"></select></div>
        <div class="field"><label>Заметки</label><textarea id="notes"></textarea></div>
      </div>
      <div class="modal-foot"><button type="button" onclick="closeModal()">Отмена</button><button class="primary" type="submit">Сохранить</button></div>
    </form>
  </div>
</div>

<div id="historyModal" class="modal-bg">
  <div class="modal">
    <div class="modal-head"><strong>История изменений</strong><button class="close" onclick="closeHistory()">×</button></div>
    <div class="modal-body"><div id="historyList" class="history-list"></div></div>
    <div class="modal-foot"><button onclick="clearHistory()">Очистить историю</button><button class="primary" onclick="closeHistory()">Закрыть</button></div>
  </div>
</div>

async function loadServerData(){

  const url=API_URL+(API_URL.includes("?")?"&":"?")+"t="+Date.now();

    try{const d=await r.json();if(d.error)msg=d.error;}catch(e){}

  if(Array.isArray(d.history)){changeHistory=d.history.slice(0,100).map(stripH);saveHistory()}
  if(d.lastSavedAt){lastSavedAt=d.lastSavedAt;lsSet("familyTreeKnyazevy_lastSavedAt",lastSavedAt)}
  serverLoaded=true;updateLockUI();
  savePeople();saveConnections();savePositions();saveGroupTags();
  render();centerTree();
  toast("✓ Актуальная база загружена с сервера");
}

  const a=[],seen=new Set();

    const k=pa+">"+ch.id;if(seen.has(k))return;seen.add(k);
    a.push({id:uid(),type:"parent",from:pa,to:ch.id,bendX:0,bendY:0});
  }));

  people.forEach(p=>(p.spouses||[]).forEach(q=>{
    if(!getPerson(q))return;const ids=[p.id,q].sort(),k=ids[0]+"::"+ids[1];

const CARD_W=210,CARD_DEF_H=126,SVGNS="http://www.w3.org/2000/svg";
// Невидимая сетка: карточки при перетаскивании прилипают к шагу в половину своей ширины/высоты.
const GRID_X=CARD_W/4,GRID_Y=CARD_DEF_H/2;
function snapToGrid(v,step){return Math.round(v/step)*step}
function edgePoint(cx,cy,hw,hh,tx,ty,gap){
  const dx=tx-cx,dy=ty-cy,len=Math.hypot(dx,dy);
  if(!len)return{x:cx,y:cy};
  const k=Math.min(hw/(Math.abs(dx)||1e-9),hh/(Math.abs(dy)||1e-9));
  return{x:cx+dx*k+dx/len*gap,y:cy+dy*k+dy/len*gap};
}
function geom(c){
  const a=positions[c.from],b=positions[c.to];if(!a||!b)return null;
  const hw=CARD_W/2,ha=(cardH[c.from]||CARD_DEF_H)/2,hb=(cardH[c.to]||CARD_DEF_H)/2;
  const ax=a.x+hw,ay=a.y+ha,bx=b.x+hw,by=b.y+hb;
  const cx0=(ax+bx)/2,cy0=(ay+by)/2,mx=cx0+(c.bendX||0),my=cy0+(c.bendY||0);
  return{s:edgePoint(ax,ay,hw,ha,mx,my,3),e:edgePoint(bx,by,hw,hb,mx,my,3),mx,my,cx0,cy0};
}
// Овалы выделения: не хранят координат сами, а считаются по позициям отмеченных карточек,
// поэтому всегда «привязаны к плиткам» и сами едут вслед за перетаскиванием.
// Карточки одного цвета группируются в «кластеры» по близости, а затем контур каждого
// кластера проверяется на пересечение с ЛЮБЫМ чужим (не входящим в кластер) человеком:
// если фигура его задевает, кластер разбивается так, чтобы обойти его стороной.
const GROUP_GAP=190,GROUP_PAD=42,GROUP_ROUND=82;
function allCardBoxes(){
  const boxes={};
  people.forEach(p=>{
    const pos=positions[p.id];if(!pos)return;
    const h=cardH[p.id]||CARD_DEF_H;
    boxes[p.id]={x1:pos.x,y1:pos.y,x2:pos.x+CARD_W,y2:pos.y+h};
  });
  return boxes;
}
function groupClusters(ids,allBoxes){
  const list=ids.filter(id=>allBoxes[id]),parent={};
  list.forEach(id=>parent[id]=id);
  const find=a=>{while(parent[a]!==a){parent[a]=parent[parent[a]];a=parent[a]}return a};
  const union=(a,b)=>{const ra=find(a),rb=find(b);if(ra!==rb)parent[ra]=rb};
  const rectGap=(a,b)=>{
    const dx=Math.max(a.x1-b.x2,b.x1-a.x2,0),dy=Math.max(a.y1-b.y2,b.y1-a.y2,0);
    return Math.hypot(dx,dy);
  };
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)
    if(rectGap(allBoxes[list[i]],allBoxes[list[j]])<=GROUP_GAP)union(list[i],list[j]);
  const clusters={};
  list.forEach(id=>{const r=find(id);(clusters[r]=clusters[r]||[]).push(id)});
  return Object.values(clusters);

function convexHull(points){
  points=points.slice().sort((a,b)=>a.x-b.x||a.y-b.y);
  if(points.length<3)return points;
  const cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const lower=[];
  for(const p of points){
    while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();
    lower.push(p);
  }
  const upper=[];
  for(let i=points.length-1;i>=0;i--){
    const p=points[i];
    while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();
    upper.push(p);
  }
  upper.pop();lower.pop();
  return lower.concat(upper);
}
// Плавный контур: в каждом углу выпуклой оболочки прямые линии сопрягаются кубической
// кривой Безье с постоянной окружности (k≈0.5523) — такая кривая ложится по-настоящему
// круглой дугой, а не параболой, поэтому линия выглядит заметно более гладкой и живой.
const BEZIER_CIRCLE_K=.5523;
function smoothHullPath(hull,radius){
  const n=hull.length;if(!n)return "";
  if(n<3){const p=hull[0];return `M ${p.x-1} ${p.y} a1 1 0 1 0 2 0 a1 1 0 1 0 -2 0 Z`}
  let d="";
  hull.forEach((p,i)=>{
    const prev=hull[(i-1+n)%n],next=hull[(i+1)%n];
    const d1=Math.hypot(p.x-prev.x,p.y-prev.y)||1,d2=Math.hypot(next.x-p.x,next.y-p.y)||1;
    const r=Math.max(6,Math.min(radius,d1*.45,d2*.45));
    const ux1=(p.x-prev.x)/d1,uy1=(p.y-prev.y)/d1,ux2=(next.x-p.x)/d2,uy2=(next.y-p.y)/d2;
    const inX=p.x-ux1*r,inY=p.y-uy1*r,outX=p.x+ux2*r,outY=p.y+uy2*r;
    const c1x=inX+ux1*r*BEZIER_CIRCLE_K,c1y=inY+uy1*r*BEZIER_CIRCLE_K;
    const c2x=outX-ux2*r*BEZIER_CIRCLE_K,c2y=outY-uy2*r*BEZIER_CIRCLE_K;
    d+=(i===0?`M ${inX} ${inY} `:`L ${inX} ${inY} `)+`C ${c1x} ${c1y} ${c2x} ${c2y} ${outX} ${outY} `;
  });
  return d+"Z";
}
// Отступ вокруг конкретной карточки уменьшается, если рядом стоит чужая (не входящая
// в этот же кластер) карточка — так контур одного человека никогда не «наезжает» на соседа.
function adaptivePad(box,ownIds,allBoxes){
  let minGap=Infinity;
  Object.keys(allBoxes).forEach(id=>{
    if(ownIds.includes(id))return;
    const b=allBoxes[id];
    const dx=Math.max(box.x1-b.x2,b.x1-box.x2,0),dy=Math.max(box.y1-b.y2,b.y1-box.y2,0);
    const gap=Math.hypot(dx,dy);
    if(gap<minGap)minGap=gap;
  });
  return Math.max(10,Math.min(GROUP_PAD,minGap/2-4));
}
function clusterPoints(ids,allBoxes){
  const pts=[];
  ids.forEach(id=>{
    const b=allBoxes[id],pad=adaptivePad(b,ids,allBoxes);
    pts.push({x:b.x1-pad,y:b.y1-pad},{x:b.x2+pad,y:b.y1-pad},
              {x:b.x2+pad,y:b.y2+pad},{x:b.x1-pad,y:b.y2+pad});
  });
  return pts;
}
function pointInPolygon(pt,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    if(((yi>pt.y)!==(yj>pt.y))&&(pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
function hullTouchesBox(hull,box){
  const pts=[{x:box.x1,y:box.y1},{x:box.x2,y:box.y1},{x:box.x2,y:box.y2},{x:box.x1,y:box.y2},
             {x:(box.x1+box.x2)/2,y:(box.y1+box.y2)/2}];
  return pts.some(p=>pointInPolygon(p,hull));
}
// Если контур кластера всё же задевает чужую карточку (например, три отмеченных человека
// стоят треугольником вокруг четвёртого, не отмеченного), из кластера убирается тот участник,
// что стоит ближе всего к мешающей карточке, — он получит свой отдельный, уже безопасный овал.
function safeClusterHulls(ids,allBoxes){
  if(ids.length<=1)return [ids];
  const hull=convexHull(clusterPoints(ids,allBoxes));
  const badId=Object.keys(allBoxes).find(id=>!ids.includes(id)&&hullTouchesBox(hull,allBoxes[id]));
  if(!badId)return [ids];
  const bad=allBoxes[badId],bcx=(bad.x1+bad.x2)/2,bcy=(bad.y1+bad.y2)/2;
  let victim=ids[0],best=Infinity;
  ids.forEach(id=>{
    const b=allBoxes[id],mx=(b.x1+b.x2)/2,my=(b.y1+b.y2)/2,d=Math.hypot(mx-bcx,my-bcy);
    if(d<best){best=d;victim=id}
  });
  const rest=ids.filter(id=>id!==victim);
  return safeClusterHulls(rest,allBoxes).concat([[victim]]);
}
function clusterPath(ids,allBoxes){
  return smoothHullPath(convexHull(clusterPoints(ids,allBoxes)),GROUP_ROUND);
}

function isAncestor(anc,id,ignoreId){
  const seen=new Set(),stack=[id];
  while(stack.length){
    const cur=stack.pop();
    connections.forEach(c=>{if(c.type==="parent"&&c.to===cur&&c.id!==ignoreId&&!seen.has(c.from)){seen.add(c.from);stack.push(c.from)}});
  }
  return seen.has(anc);
}
function connectionProblem(type,from,to,ignoreId){

    if(connections.some(c=>c.id!==ignoreId&&c.type==="spouse"&&((c.from===from&&c.to===to)||(c.from===to&&c.to===from))))return "Эти люди уже записаны как супруги.";
    return "";
  }
  if(connections.some(c=>c.id!==ignoreId&&c.type==="parent"&&c.from===from&&c.to===to))return "Такая связь «родитель → ребёнок» уже есть.";
  if(isAncestor(to,from,ignoreId))return "Получится замкнутый круг: человек окажется собственным предком.";

async function toDataUrl(file){
  if(!file)return "";
  const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=raw});
    const k=Math.min(1,320/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",.82);
  }catch(e){return raw.length<300000?raw:""}
}

function parseBirthday(p){
  const m=String(p.birthDate||"").trim().match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?$/);
  if(!m)return null;
  const d=+m[1],mo=+m[2],y=m[3]?+m[3]:null;
  const t=new Date(2000,mo-1,d);
  if(mo<1||mo>12||t.getMonth()!==mo-1||t.getDate()!==d)return null;
  return {d,mo,y};
}
function ruPlural(n,one,few,many){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b===1)return one;if(b>=2&&b<=4)return few;return many}
// Ближайший день памяти: у человека указана дата смерти с числом и месяцем.
function nextMemoryDay(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let best=null;
  people.forEach(p=>{
    if(!(p.deathDate||"").trim())return;
    const d=parseBirthday({birthDate:p.deathDate});if(!d)return;
    let when=new Date(today.getFullYear(),d.mo-1,d.d);
    if(when<today)when=new Date(today.getFullYear()+1,d.mo-1,d.d);
    const days=Math.round((when-today)/86400000);
    if(!best||days<best.days)best={days,when,people:[]};
    if(days===best.days)best.people.push({p,years:d.y?when.getFullYear()-d.y:null});
  });
  return best;
}
function updateMemory(){
  const box=document.getElementById("memoryBanner");if(!box)return;
  box.innerHTML="";
  const label=document.createElement("span");box.appendChild(label);
  const nm=nextMemoryDay();
  if(!nm){label.textContent="🕯 Нет отмеченных дат смерти";return}
  label.textContent="🕯 Ближайший день памяти:";
  nm.people.slice(0,3).forEach(({p})=>{
    const b=document.createElement("button");b.type="button";b.className="bday-name";b.textContent=nameOf(p);
    b.addEventListener("click",()=>{selectedPerson=p.id;selectedConnection=null;openPersonPanel(p);centerOn(p.id);renderPeople();renderConnections();toggleTopbar(false)});
    box.appendChild(b);
  });
  const rest=nm.people.length-3;
  const info=document.createElement("span");info.className="bday-when";
  const dd=String(nm.when.getDate()).padStart(2,"0")+"."+String(nm.when.getMonth()+1).padStart(2,"0");
  const when=nm.days===0?"сегодня":nm.days===1?"завтра":"через "+nm.days+" "+ruPlural(nm.days,"день","дня","дней");
  let text=(rest>0?"и ещё "+rest+" · ":"")+dd+" · "+when;
  if(nm.people.length===1&&nm.people[0].years){const y=nm.people[0].years;text+=" · "+y+" "+ruPlural(y,"год","года","лет")+" со дня смерти"}
  info.textContent=text;box.appendChild(info);
}
// Ближайший день рождения среди живых: без даты смерти, с указанным днём и месяцем.
// Люди, которым по дате рождения больше 110 лет, считаются умершими и пропускаются.
function nextBirthday(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let best=null;
  people.forEach(p=>{
    if((p.deathDate||"").trim())return;
    const b=parseBirthday(p);if(!b)return;
    if(b.y&&today.getFullYear()-b.y>110)return;
    let when=new Date(today.getFullYear(),b.mo-1,b.d);
    if(when<today)when=new Date(today.getFullYear()+1,b.mo-1,b.d);
    const days=Math.round((when-today)/86400000);
    if(!best||days<best.days)best={days,when,people:[]};
    if(days===best.days)best.people.push({p,age:b.y?when.getFullYear()-b.y:null});
  });
  return best;
}

  label.textContent="🎂 Ближайший день рождения:";

  const when=nb.days===0?"сегодня":nb.days===1?"завтра":"через "+nb.days+" "+ruPlural(nb.days,"день","дня","дней");
  let text=(rest>0?"и ещё "+rest+" · ":"")+dd+" · "+when;
  if(nb.people.length===1&&nb.people[0].age){const a=nb.people[0].age;text+=" · "+(nb.days===0?"исполняется ":"исполнится ")+a+" "+ruPlural(a,"год","года","лет")}

function exportBounds(){
  const items=people.map(p=>positions[p.id]).filter(Boolean);
  if(!items.length)return {x:0,y:0,w:900,h:600};
  const xs=[],ys=[]; people.forEach(p=>{const a=positions[p.id];if(a){xs.push(a.x);ys.push(a.y);xs.push(a.x+CARD_W);ys.push(a.y+(cardH[p.id]||CARD_DEF_H));}});
  const pad=80,x=Math.max(0,Math.min(...xs)-pad),y=Math.max(0,Math.min(...ys)-pad),maxX=Math.max(...xs)+pad,maxY=Math.max(...ys)+pad;
  return {x,y,w:Math.max(400,maxX-x),h:Math.max(300,maxY-y)};
}
async function makeExportCanvas(){
  if(typeof html2canvas!=="function")throw new Error("Не загрузилась библиотека экспорта изображений. Проверьте интернет-соединение.");
  const b=exportBounds();
  const holder=document.createElement("div");
  holder.style.cssText=`position:fixed;left:-100000px;top:0;width:${Math.ceil(b.w)}px;height:${Math.ceil(b.h)}px;background:#0b1220;overflow:hidden;z-index:-1`;
  const layer=document.createElement("div");
  layer.style.cssText=`position:absolute;left:0;top:0;width:${Math.ceil(b.w)}px;height:${Math.ceil(b.h)}px`;
  const cards=[];
  people.forEach(p=>{
    const src=document.querySelector(`.person[data-id="${CSS.escape(p.id)}"]`);if(!src)return;
    const c=src.cloneNode(true);c.classList.remove("search-match","search-dim","highlight","dragging");
    const pos=positions[p.id];c.style.left=(pos.x-b.x)+"px";c.style.top=(pos.y-b.y)+"px";c.style.transform="none";c.style.zIndex="10";c.style.opacity="1";
    cards.push(c);layer.appendChild(c);
  });
  const svgClone=svg.cloneNode(true);svgClone.removeAttribute("style");
  // viewBox сам сдвигает координаты мира в экспортное полотно — дополнительный translate не нужен.
  const bw=Math.ceil(b.w),bh=Math.ceil(b.h);
  svgClone.setAttribute("xmlns",SVGNS);svgClone.setAttribute("viewBox",`${b.x} ${b.y} ${bw} ${bh}`);svgClone.setAttribute("width",bw);svgClone.setAttribute("height",bh);
  svgClone.style.cssText=`position:absolute;left:0;top:0;width:${bw}px;height:${bh}px;overflow:hidden`;
  svgClone.querySelectorAll(".connection-hit,.line-handle").forEach(n=>n.remove());
  // Стили из CSS не попадают внутрь SVG-картинки, поэтому задаём их атрибутами.
  svgClone.querySelectorAll(".connection").forEach(n=>{
    const sel=n.classList.contains("selected"),sp=n.classList.contains("spouse");
    n.setAttribute("fill","none");n.setAttribute("stroke",sel?"#60a5fa":sp?"#f59e0b":"#94a3b8");n.setAttribute("stroke-width",sel?5:3.5);n.setAttribute("stroke-linecap","round");
  });
  layer.insertBefore(svgClone,layer.firstChild);
  holder.appendChild(layer);document.body.appendChild(holder);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{return await html2canvas(holder,{backgroundColor:"#0b1220",scale:Math.min(2,2400/Math.max(b.w,b.h)),useCORS:true,logging:false})}
  finally{holder.remove()}
}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function exportTree(type){
  document.getElementById("exportMenu").classList.remove("open");
  toast("⏳ Формирую файл…");
  try{
    const canvas=await makeExportCanvas();
    const base="rodoslovnaya-knyazevy-"+new Date().toISOString().slice(0,10);
    if(type==="png")canvas.toBlob(b=>downloadBlob(b,base+".png"),"image/png");
    else if(type==="jpeg")canvas.toBlob(b=>downloadBlob(b,base+".jpg"),"image/jpeg",.95);
    else if(type==="tiff"){
      if(typeof UTIF==="undefined")throw new Error("Не загрузилась библиотека TIFF.");
      const img=canvas.getContext("2d").getImageData(0,0,canvas.width,canvas.height);
      const buf=UTIF.encodeImage(img.data,img.width,img.height);downloadBlob(new Blob([buf],{type:"image/tiff"}),base+".tiff");
    }else if(type==="pdf"){
      if(!window.jspdf?.jsPDF)throw new Error("Не загрузилась библиотека PDF.");
      const {jsPDF}=window.jspdf;const landscape=canvas.width>=canvas.height;const pdf=new jsPDF({orientation:landscape?"landscape":"portrait",unit:"mm",format:"a4"});
      const margin=8,pageW=pdf.internal.pageSize.getWidth()-margin*2,pageH=pdf.internal.pageSize.getHeight()-margin*2;const ratio=Math.min(pageW/canvas.width,pageH/canvas.height);const w=canvas.width*ratio,h=canvas.height*ratio;pdf.addImage(canvas.toDataURL("image/jpeg",.94),"JPEG",(pdf.internal.pageSize.getWidth()-w)/2,(pdf.internal.pageSize.getHeight()-h)/2,w,h);pdf.save(base+".pdf");
    }
    toast("✓ Файл готов");
  }catch(err){console.error(err);alert("Не удалось создать файл: "+err.message)}
}
function exportTable(type){

  if(type==="csv"){
    const head=Object.keys(rows[0]||{"Имя":""});const escCsv=v=>`"${String(v??"").replace(/"/g,'""')}"`;const csv="\ufeff"+head.map(escCsv).join(";")+"\r\n"+rows.map(r=>head.map(k=>escCsv(r[k])).join(";")).join("\r\n");downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),"rodoslovnaya-knyazevy.csv");
  }else{
    if(typeof XLSX==="undefined"){alert("Не загрузилась библиотека Excel. Проверьте интернет-соединение.");return}
    const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Родословная");XLSX.writeFile(wb,"rodoslovnaya-knyazevy.xlsx");

}
